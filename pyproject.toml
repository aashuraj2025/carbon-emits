[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-audit"
version = "0.1.0"
description = "Estimate, reduce and measure the energy and carbon footprint of ML workloads"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
track = ["codecarbon>=2.4"]
ml = ["scikit-learn>=1.3", "numpy", "joblib"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
carbon-audit = "carbon_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
